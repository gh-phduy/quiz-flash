name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    environment:
      name: Production
      url: https://quiz-flash.evnnpd.workers.dev
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ogbwpzclxbidlnygckfz.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9nYndwemNseGJpZGxueWdja2Z6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0NDY3NzYsImV4cCI6MjEwMDAyMjc3Nn0.5zHmtaMEbk-DmVspfnE9SlLma09pBz4gJrmfhJRDSnI
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js & OpenNext
        run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
